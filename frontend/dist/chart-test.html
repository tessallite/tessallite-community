<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/charts.min.css" />
<style>body { font-family: sans-serif; padding: 20px; background: #fafafa; }</style>
</head>
<body>
<h2>Charts.css Rendering Test</h2>

<h3>Column (vertical bar)</h3>
<div id="tsc-test1" style="max-width:600px;height:300px">
<style>#tsc-test1 .charts-css { --labels-size: 3rem; --color-1: #006C35; --color-2: #D4AF37; --color-3: #3A5EA8; --color-4: #7B3FA0; --color-5: #B33A3A; }</style>
<div style="font-size:13px;font-weight:600;margin-bottom:4px;color:#444">Total Sales</div>
<table class="charts-css column show-labels show-data-on-hover data-spacing-5 show-primary-axis show-4-secondary-axes">
<caption>Total Sales</caption>
<tbody>
<tr><th scope="row">London</th><td style="--size: 1.0"><span class="data">500</span></td></tr>
<tr><th scope="row">Paris</th><td style="--size: 0.6"><span class="data">300</span></td></tr>
<tr><th scope="row">Berlin</th><td style="--size: 0.4"><span class="data">200</span></td></tr>
<tr><th scope="row">Tokyo</th><td style="--size: 0.7"><span class="data">350</span></td></tr>
<tr><th scope="row">NYC</th><td style="--size: 0.8"><span class="data">400</span></td></tr>
</tbody>
</table>
</div>

<h3>Pie</h3>
<div id="tsc-test2" style="max-width:600px;height:300px">
<style>#tsc-test2 .charts-css { --labels-size: 3rem; --color-1: #006C35; --color-2: #D4AF37; --color-3: #3A5EA8; }</style>
<div style="font-size:13px;font-weight:600;margin-bottom:4px;color:#444">Market Share</div>
<table class="charts-css pie">
<caption>Share</caption>
<tbody>
<tr><th scope="row">A</th><td style="--start: 0; --end: 0.5; --color: #006C35"><span class="data">50%</span></td></tr>
<tr><th scope="row">B</th><td style="--start: 0.5; --end: 0.8; --color: #D4AF37"><span class="data">30%</span></td></tr>
<tr><th scope="row">C</th><td style="--start: 0.8; --end: 1.0; --color: #3A5EA8"><span class="data">20%</span></td></tr>
</tbody>
</table>
<div style="font-size:12px;margin-bottom:4px"><span style="display:inline-block;width:12px;height:12px;background:#006C35;margin-right:4px"></span>A&nbsp;&nbsp; <span style="display:inline-block;width:12px;height:12px;background:#D4AF37;margin-right:4px"></span>B&nbsp;&nbsp; <span style="display:inline-block;width:12px;height:12px;background:#3A5EA8;margin-right:4px"></span>C&nbsp;&nbsp;</div>
</div>

<h3>Horizontal Bar</h3>
<div id="tsc-test3" style="max-width:600px;height:300px">
<style>#tsc-test3 .charts-css { --labels-size: 3rem; --color-1: #006C35; --color-2: #D4AF37; --color-3: #3A5EA8; }</style>
<div style="font-size:13px;font-weight:600;margin-bottom:4px;color:#444">Revenue by Quarter</div>
<table class="charts-css bar show-labels show-data-on-hover data-spacing-5 show-primary-axis show-4-secondary-axes">
<caption>Revenue</caption>
<tbody>
<tr><th scope="row">Q1</th><td style="--size: 0.9"><span class="data">900</span></td></tr>
<tr><th scope="row">Q2</th><td style="--size: 0.6"><span class="data">600</span></td></tr>
<tr><th scope="row">Q3</th><td style="--size: 1.0"><span class="data">1000</span></td></tr>
</tbody>
</table>
</div>

<h3>Line</h3>
<div id="tsc-test4" style="max-width:600px;height:300px">
<style>#tsc-test4 .charts-css { --labels-size: 3rem; --color-1: #006C35; }</style>
<div style="font-size:13px;font-weight:600;margin-bottom:4px;color:#444">Monthly Trend</div>
<table class="charts-css line show-labels show-data-on-hover show-primary-axis show-4-secondary-axes">
<caption>Revenue</caption>
<tbody>
<tr><th scope="row">Jan</th><td style="--start: 0.4; --end: 0.4"><span class="data">400</span></td></tr>
<tr><th scope="row">Feb</th><td style="--start: 0.4; --end: 0.6"><span class="data">600</span></td></tr>
<tr><th scope="row">Mar</th><td style="--start: 0.6; --end: 0.8"><span class="data">800</span></td></tr>
<tr><th scope="row">Apr</th><td style="--start: 0.8; --end: 0.7"><span class="data">700</span></td></tr>
<tr><th scope="row">May</th><td style="--start: 0.7; --end: 1.0"><span class="data">1000</span></td></tr>
</tbody>
</table>
</div>

</body>
</html>
