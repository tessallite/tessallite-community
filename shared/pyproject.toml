[project]
name = "tessallite-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "sqlglot>=30.8.0,<31.0.0",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "fastapi==0.136.1",
    "pyyaml>=6.0.0",
    "croniter>=2.0.0",
    # calendar_type="hijri": shared/semantic/calendar_dialects.py imports
    # hijri_converter; 2.3.1 pinned (3.x renames the package to hijridate).
    "hijri-converter==2.3.1",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.6.0"]
sqlserver = ["aioodbc>=0.5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "lkml>=1.3.5,<2.0",
    "jsonschema>=4.23.0,<5.0",
]

[tool.setuptools]
packages = ["config", "db", "db.migrations", "db.migrations.versions", "schemas", "auth", "middleware", "model_snapshot", "pocket", "semantic", "importers"]
