# dbt 1.7+ semantic model modeled after acme-demo "modely" (payment transactions)
# Used for integration testing of dbt_parser.py and dbt_mapper.py
semantic_models:
  - name: payment_transactions
    model: ref('payment_transaction')
    description: >
      Payment transaction fact table. One row per payment event covering
      authorisation, settlement, chargebacks, and refunds across multiple
      payment schemes and channels.
    defaults:
      agg_time_dimension: business_date

    entities:
      - name: payment_id
        type: primary
      - name: customer_id
        type: foreign
      - name: merchant_id
        type: foreign
      - name: account_id
        type: foreign

    dimensions:
      - name: business_date
        type: time
        expr: cast(business_date as date)
        type_params:
          time_granularity: day
        description: Main business date for the transaction

      - name: transaction_ts
        type: time
        type_params:
          time_granularity: second
        description: Exact timestamp of the transaction event

      - name: posting_ts
        type: time
        type_params:
          time_granularity: second
        description: Timestamp when the transaction was posted to the ledger

      - name: settlement_ts
        type: time
        type_params:
          time_granularity: second
        description: Timestamp when settlement completed

      - name: payment_status
        type: categorical
        description: Current status of the payment (authorised, settled, declined, reversed)

      - name: event_type
        type: categorical
        description: Type of payment event (auth, capture, refund, chargeback)

      - name: lifecycle_stage
        type: categorical
        description: Stage in the payment lifecycle

      - name: payment_scheme
        type: categorical
        description: Payment network (Visa, Mastercard, SEPA, SWIFT)

      - name: payment_method
        type: categorical
        description: Method of payment (card, bank_transfer, wallet, direct_debit)

      - name: service_type
        type: categorical
        description: Service classification

      - name: account_type
        type: categorical
        description: Type of account (current, savings, corporate)

      - name: customer_type
        type: categorical
        description: Customer classification (retail, corporate, institutional)

      - name: customer_segment
        type: categorical
        description: Customer segment (premium, standard, basic)

      - name: device_type
        type: categorical
        description: Device used for the transaction (mobile, desktop, terminal, atm)

      - name: card_entry_mode
        type: categorical
        description: How the card was presented (chip, contactless, magstripe, manual, ecommerce)

      - name: auth_method
        type: categorical
        description: Authentication method (pin, signature, 3ds, biometric)

      - name: channel_code
        type: categorical
        description: Transaction channel (online, branch, atm, pos)

      - name: product_code
        type: categorical
        description: Product identifier

      - name: product_name
        type: categorical
        description: Human-readable product name

      - name: merchant_category
        type: categorical
        description: Merchant category description

      - name: merchant_category_code
        type: categorical
        description: Standard MCC code

      - name: merchant_name
        type: categorical
        description: Merchant trading name

      - name: country_code
        type: categorical
        description: Two-letter ISO country code of the transaction origin

      - name: region_code
        type: categorical
        description: Regional code for geographic segmentation

      - name: city_name
        type: categorical
        description: City where the transaction occurred

      - name: transaction_currency
        type: categorical
        description: Original transaction currency (ISO 4217)

      - name: settlement_currency
        type: categorical
        description: Currency used for settlement

      - name: risk_decision
        type: categorical
        description: Outcome of risk assessment (approved, declined, review)

      - name: fraud_flag
        type: categorical
        expr: cast(fraud_flag as varchar)
        description: Whether the transaction was flagged as fraudulent

      - name: chargeback_flag
        type: categorical
        expr: cast(chargeback_flag as varchar)
        description: Whether a chargeback was raised

      - name: refund_flag
        type: categorical
        expr: cast(refund_flag as varchar)
        description: Whether a refund was issued

      - name: source_system
        type: categorical
        description: Originating system identifier

    measures:
      - name: transaction_amount
        agg: sum
        description: Total transaction amount in original currency

      - name: base_amount
        agg: sum
        description: Transaction amount converted to base currency

      - name: settlement_amount
        agg: sum
        description: Amount settled after fees and FX conversion

      - name: net_amount
        agg: sum
        description: Net amount after all deductions

      - name: commission_amount
        agg: sum
        description: Commission earned on the transaction

      - name: fee_amount
        agg: sum
        description: Processing fees charged

      - name: refund_amount
        agg: sum
        description: Total refunds issued

      - name: tax_amount
        agg: sum
        description: Tax collected

      - name: chargeback_amount
        agg: sum
        description: Chargeback amounts

      - name: discount_amount
        agg: sum
        description: Discounts applied

      - name: risk_score
        agg: average
        description: Average risk score across transactions

      - name: fx_rate
        agg: average
        expr: fx_rate
        description: Average foreign exchange rate applied

      - name: transaction_count
        agg: count
        expr: payment_id
        description: Count of transactions
        create_metric: true

      - name: unique_customers
        agg: count_distinct
        expr: customer_id
        description: Distinct count of customers transacting

      - name: unique_merchants
        agg: count_distinct
        expr: merchant_id
        description: Distinct count of merchants receiving payments

      - name: max_transaction
        agg: max
        expr: transaction_amount
        description: Largest single transaction amount

      - name: min_transaction
        agg: min
        expr: transaction_amount
        description: Smallest single transaction amount

metrics:
  - name: total_transaction_volume
    type: simple
    label: Total Transaction Volume
    description: Sum of all transaction amounts
    type_params:
      measure: transaction_amount

  - name: total_settlement
    type: simple
    label: Total Settlement
    description: Sum of all settled amounts
    type_params:
      measure: settlement_amount

  - name: total_fees
    type: simple
    label: Total Fees
    description: Total processing fees collected
    type_params:
      measure: fee_amount

  - name: net_revenue
    type: derived
    label: Net Revenue
    description: Net amount after deducting refunds and chargebacks
    type_params:
      expr: net - refunds - chargebacks
      metrics:
        - name: total_transaction_volume
          alias: net
        - name: total_refunds
          alias: refunds
        - name: total_chargebacks
          alias: chargebacks

  - name: total_refunds
    type: simple
    label: Total Refunds
    description: Sum of all refund amounts
    type_params:
      measure: refund_amount

  - name: total_chargebacks
    type: simple
    label: Total Chargebacks
    description: Sum of all chargeback amounts
    type_params:
      measure: chargeback_amount

  - name: avg_risk_score
    type: simple
    label: Average Risk Score
    description: Mean risk score across all transactions
    type_params:
      measure: risk_score

  - name: fraud_transactions
    type: simple
    label: Fraud Transactions
    description: Count of transactions flagged as fraudulent
    type_params:
      measure: transaction_count
    filter: |
      {{ Dimension('payment_id__fraud_flag') }} = 'true'

  - name: settled_transactions
    type: simple
    label: Settled Transactions
    description: Count of fully settled transactions
    type_params:
      measure: transaction_count
    filter: |
      {{ Dimension('payment_id__payment_status') }} = 'settled'

  - name: cumulative_volume
    type: cumulative
    label: Cumulative Transaction Volume
    description: Running total of transaction amounts
    type_params:
      measure: transaction_amount

  - name: weekly_volume
    type: cumulative
    label: Weekly Transaction Volume
    description: Rolling 7-day transaction volume
    type_params:
      measure: transaction_amount
      window: 7 days
