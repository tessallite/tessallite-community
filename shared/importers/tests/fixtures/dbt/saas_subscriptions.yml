# dbt 1.7+ semantic model — SaaS subscriptions + transactions
# Source: dbt documentation (measures, non-additive dimensions)
# Tests: non_additive_dimension (MRR), window_groupings, multiple
#        semantic_models in one file, sum_boolean, percentile agg_params
semantic_models:
  - name: transactions
    description: >
      A record of every transaction that takes place.
      Carts are considered multiple transactions for each SKU.
    model: ref('transactions')
    defaults:
      agg_time_dimension: transaction_date

    entities:
      - name: transaction_id
        type: primary
      - name: customer_id
        type: foreign
      - name: store_id
        type: foreign
      - name: product_id
        type: foreign

    dimensions:
      - name: transaction_date
        type: time
        expr: date_trunc('day', ts)
        type_params:
          time_granularity: day
      - name: is_bulk_transaction
        type: categorical
        expr: case when quantity > 10 then true else false end
      - name: transaction_location
        type: categorical
        expr: order_country
      - name: payment_method
        type: categorical
        description: How the customer paid (credit_card, debit, wire, crypto)

    measures:
      - name: transaction_amount_usd
        description: Total USD value of transactions
        expr: transaction_amount_usd
        agg: sum
      - name: transaction_amount_usd_avg
        description: Average USD value of transactions
        expr: transaction_amount_usd
        agg: average
      - name: transaction_amount_usd_max
        description: Maximum USD value of transactions
        expr: transaction_amount_usd
        agg: max
      - name: transaction_amount_usd_min
        description: Minimum USD value of transactions
        expr: transaction_amount_usd
        agg: min
      - name: quick_buy_transactions
        description: The total transactions bought as quick buy
        expr: quick_buy_flag
        agg: sum_boolean
      - name: distinct_transactions_count
        description: Distinct count of transactions
        expr: transaction_id
        agg: count_distinct
      - name: transactions_amount_usd_valid
        description: The total USD value of valid transactions only
        expr: case when is_valid = True then transaction_amount_usd else 0 end
        agg: sum
      - name: p99_transaction_value
        description: The 99th percentile transaction value
        expr: transaction_amount_usd
        agg: percentile
        agg_params:
          percentile: .99
          use_discrete_percentile: false
      - name: median_transaction_value
        description: The median transaction value
        expr: transaction_amount_usd
        agg: median

  - name: subscriptions
    description: >
      A subscription table with one row per date for each active user
      and their subscription plans. Used for MRR calculations with
      non-additive dimension semantics.
    model: ref('subscription_table')
    defaults:
      agg_time_dimension: subscription_date

    entities:
      - name: user_id
        type: foreign
      - name: subscription_id
        type: primary

    dimensions:
      - name: subscription_date
        type: time
        expr: date_transaction
        type_params:
          time_granularity: day
      - name: plan_type
        type: categorical
        description: Subscription plan tier (free, starter, professional, enterprise)
      - name: billing_interval
        type: categorical
        description: Billing frequency (monthly, annual)

    measures:
      - name: count_users
        description: Count of active users at the end of the period
        expr: user_id
        agg: count_distinct
        non_additive_dimension:
          name: subscription_date
          window_choice: max
      - name: mrr
        description: Monthly recurring revenue — aggregate by summing active subscriptions
        expr: subscription_value
        agg: sum
        non_additive_dimension:
          name: subscription_date
          window_choice: max
      - name: user_mrr
        description: Per-user MRR grouped by user_id for retention analysis
        expr: subscription_value
        agg: sum
        non_additive_dimension:
          name: subscription_date
          window_choice: max
          window_groupings:
            - user_id
      - name: new_subscriptions
        description: Count of new subscription sign-ups
        agg: count
        expr: subscription_id
      - name: arr
        description: Annualised recurring revenue
        expr: subscription_value * 12
        agg: sum
        non_additive_dimension:
          name: subscription_date
          window_choice: max

metrics:
  - name: total_transaction_amount
    description: Sum of all transaction amounts in USD.
    type: simple
    label: Total Transaction Amount
    type_params:
      measure: transaction_amount_usd

  - name: count_distinct_transactions
    description: Count of unique transactions.
    type: simple
    label: Distinct Transactions
    type_params:
      measure: distinct_transactions_count

  - name: monthly_recurring_revenue
    description: Monthly recurring revenue across all subscriptions.
    type: simple
    label: MRR
    type_params:
      measure: mrr

  - name: annual_recurring_revenue
    description: Annualised recurring revenue.
    type: simple
    label: ARR
    type_params:
      measure: arr

  - name: cumulative_mrr
    description: Cumulative MRR over a rolling 12-month window.
    type: cumulative
    label: Cumulative MRR (12 Months)
    type_params:
      measure: mrr
      window: 12 months

  - name: enterprise_mrr
    description: MRR from enterprise plan customers only.
    type: simple
    label: Enterprise MRR
    type_params:
      measure: mrr
    filter: |
      {{ Dimension('subscription_id__plan_type') }} = 'enterprise'

  - name: net_revenue
    description: Transaction revenue minus estimated refunds (10% assumption).
    type: derived
    label: Net Revenue
    type_params:
      expr: total - total * 0.10
      metrics:
        - name: total_transaction_amount
          alias: total
