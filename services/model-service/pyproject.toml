[project]
name = "model-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "prometheus-client>=0.20.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    # calendar_type="hijri": shared/semantic/calendar_dialects.py imports
    # hijri_converter; 2.3.1 pinned (3.x renames the package to hijridate).
    "hijri-converter==2.3.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlglot>=30.8.0,<31.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.1.0",
    "ldap3>=2.9.0",
    "google-cloud-bigquery>=3.0.0",
    "google-auth>=2.29.0",
    "authlib>=1.3.0",
    "python3-saml>=1.16.0",
    "pyhive>=0.7.0",
    "thrift>=0.16.0",
    "pure-sasl>=0.6.2",
    "snowflake-connector-python>=3.6.0",
    "db-dtypes>=1.2.0",
    "aioodbc>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests — mocked DB, or one service + a real Postgres (skip via TESSALLITE_VERSIONING_DB_URL)",
    "e2e: End-to-end tests requiring running services",
]
