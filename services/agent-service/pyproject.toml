[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "prometheus-client>=0.20.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1.0",
    "google-generativeai>=0.8.0",
    "google-genai>=1.0.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "PyJWT>=2.8.0",
    "sqlglot>=30.8.0,<31.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring mocked DB",
    "e2e: End-to-end tests requiring running services",
]
